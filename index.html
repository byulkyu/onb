<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>onb — Only, Nothing, But everything</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+KR:wght@300;400;700&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#0a0a0a;--mute:#8a8a8a;--line:#e8e8e8;--soft:#f5f5f5;--ease:cubic-bezier(.65,0,.2,1);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.9 'Noto Sans KR','Inter',sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-family:'Inter','Noto Sans KR',sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:rgba(255,255,255,.9);z-index:60}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;justify-content:space-between;align-items:center;height:64px;padding:0 clamp(18px,4vw,48px);background:rgba(255,255,255,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font:800 24px 'Inter',sans-serif;letter-spacing:-.04em;color:var(--ink);text-decoration:none}
nav ul{display:flex;gap:6px;list-style:none;margin:0;padding:0}
nav a.l{position:relative;color:var(--ink);text-decoration:none;font-size:13px;padding:8px 12px;white-space:nowrap}
nav a.l::after{content:"";position:absolute;left:12px;right:12px;bottom:4px;height:1px;background:var(--ink);transform:scaleX(0);transform-origin:right;transition:transform .4s var(--ease)}
nav a.l:hover::after{transform:scaleX(1);transform-origin:left}
/* banner */
.hero{padding:16px clamp(12px,3vw,40px) 0}
.bn{position:relative;height:min(74vh,640px);min-height:380px;border-radius:22px;overflow:hidden;background:#0a0a0a;color:#fff;isolation:isolate}
.sl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(24px,5vw,64px) clamp(24px,5vw,64px) 90px;opacity:0;visibility:hidden;transition:opacity 1s var(--ease),visibility 1s;background-size:cover;background-position:center}
.sl.on{opacity:1;visibility:visible}
.sl.light{background-color:#f2f2f2;color:#0a0a0a}
.sl::before{content:"";position:absolute;z-index:-1;width:60vmin;height:60vmin;border-radius:50%;right:-8vmin;top:-10vmin;border:1px solid currentColor;opacity:.25;transform:scale(.6);transition:transform 6s linear}
.sl::after{content:"";position:absolute;z-index:-1;width:34vmin;height:34vmin;border-radius:50%;right:6vmin;top:4vmin;background:currentColor;opacity:.08;transform:translateY(40px);transition:transform 6s linear}
.sl.on::before{transform:scale(1.15)}.sl.on::after{transform:translateY(-30px)}
.sl small{font:600 12px 'Inter',sans-serif;letter-spacing:.2em;text-transform:uppercase;opacity:.7}
.sl h2{font:800 clamp(34px,7.2vw,96px)/1.02 'Inter','Noto Sans KR',sans-serif;letter-spacing:-.045em;margin:12px 0 14px;max-width:14em}
.sl p{margin:0;font-size:clamp(14px,1.6vw,18px);font-weight:300;opacity:.85}
.sl small,.sl h2,.sl p{opacity:0;transform:translateY(28px);transition:transform .9s var(--ease) .25s,opacity .9s .25s}
.sl.on small,.sl.on h2,.sl.on p{opacity:1;transform:none}
.sl.on h2{transition-delay:.4s}.sl.on p{transition-delay:.55s;opacity:.85}
.dots{position:absolute;left:clamp(24px,5vw,64px);bottom:34px;display:flex;gap:10px;z-index:5}
.dot{width:12px;height:12px;border-radius:12px;border:0;padding:0;cursor:pointer;background:rgba(128,128,128,.5);position:relative;overflow:hidden;transition:width .5s var(--ease),background .3s}
.dot:hover{background:rgba(128,128,128,.9)}
.dot.on{width:56px}
.dot i{position:absolute;inset:0;background:currentColor;transform:scaleX(0);transform-origin:left}
.dot.on i{animation:fill var(--dur) linear forwards}
@keyframes fill{to{transform:scaleX(1)}}
.bn{--c:#fff}.dots{color:#fff}.bn.lt .dots{color:#0a0a0a}
.cnt{position:absolute;right:clamp(24px,5vw,64px);bottom:30px;font:600 13px 'Inter',sans-serif;letter-spacing:.1em;z-index:5;color:#fff;mix-blend-mode:difference}
/* intro */
.intro{text-align:center;padding:clamp(70px,12vw,140px) 24px 20px}
.big{font:800 clamp(100px,24vw,280px)/.85 'Inter',sans-serif;letter-spacing:-.07em;display:flex;justify-content:center;overflow:hidden;padding-bottom:.05em}
.big span{display:inline-block;transform:translateY(110%);transition:transform 1.1s var(--ease)}
.big.on span{transform:none}.big span:nth-child(2){transition-delay:.12s}.big span:nth-child(3){transition-delay:.24s}
.tag{font:600 clamp(13px,2vw,18px) 'Inter',sans-serif;letter-spacing:.3em;text-transform:uppercase;margin-top:28px}
.tag em{font-style:normal;color:var(--mute);transition:color .4s}.tag em:hover{color:var(--ink)}
.sub{margin-top:10px;color:var(--mute);font-weight:300}
section{max-width:1000px;margin:0 auto;padding:clamp(80px,12vw,150px) 24px 0}
.h{display:flex;align-items:center;gap:16px;margin-bottom:40px}
.h small{font:600 12px 'Inter',sans-serif;color:var(--mute);letter-spacing:.1em}
.h h2{font-size:clamp(14px,2vw,16px);font-weight:600;letter-spacing:.02em}
.h::after{content:"";flex:1;height:1px;background:var(--line);transform:scaleX(0);transform-origin:left;transition:transform 1.2s var(--ease)}
.rv.on .h::after{transform:none}
.rv{opacity:0;transform:translateY(36px);transition:opacity 1s var(--ease),transform 1s var(--ease)}.rv.on{opacity:1;transform:none}
.q{font:700 clamp(24px,4.4vw,44px)/1.35 'Noto Serif KR','Noto Sans KR',serif;letter-spacing:-.03em;margin:0 0 36px}
.txt p{margin:0 0 1.3em;max-width:36em;font-size:17px;color:#2b2b2b}
.hl{background:linear-gradient(var(--ink),var(--ink)) 0 100%/0 2px no-repeat;transition:background-size 1.2s .5s var(--ease)}
.rv.on .hl{background-size:100% 2px}
/* members */
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:640px;margin:0 auto}
.b{aspect-ratio:1;position:relative;border:0;padding:0;border-radius:6px;font:inherit;opacity:0;transform:scale(.3) translateY(50px);transition:opacity .6s,transform .8s cubic-bezier(.2,1.2,.4,1),background .3s}
.grid.go .b{opacity:1;transform:none;transition-delay:calc(var(--d)*70ms)}
.b.d{background:var(--soft)}.b.d.k{background:#e9e9e9}
.b.m{cursor:pointer;background:#0a0a0a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;overflow:hidden}
.b.m i{font:800 clamp(18px,4.4vw,34px)/1 'Noto Sans KR',sans-serif;font-style:normal;transition:transform .4s var(--ease)}
.b.m span{font:400 clamp(8px,1.7vw,12px) 'Inter','Noto Sans KR',sans-serif;opacity:.65;letter-spacing:.05em}
.grid.go .b.m:hover{transform:scale(1.1);z-index:5;transition-delay:0s;transition-duration:.35s;box-shadow:0 16px 30px rgba(0,0,0,.25)}
.b.m:hover i{transform:translateY(-3px) scale(1.12)}
.hint{text-align:center;font-size:12px;color:var(--mute);margin-top:20px;letter-spacing:.08em}
/* works */
.works{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.w{transition-delay:calc(var(--n)*.1s)}
.w .ph{aspect-ratio:4/5;border-radius:10px;background:var(--soft);display:flex;align-items:flex-end;padding:18px;font:800 64px/1 'Inter',sans-serif;letter-spacing:-.05em;color:#d4d4d4;overflow:hidden;position:relative;transition:background .5s,color .5s}
.w:hover .ph{background:#0a0a0a;color:#fff}
.w h3{font-size:16px;margin:14px 2px 0;font-weight:600}.w p{margin:2px;font-size:13px;color:var(--mute)}
footer{margin-top:clamp(90px,14vw,170px);border-top:1px solid var(--line);padding:50px 24px calc(50px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mute)}
footer b{font:800 22px 'Inter',sans-serif;color:var(--ink);letter-spacing:-.04em}
/* member page */
#mp{position:fixed;z-index:100;background:#0a0a0a;overflow:hidden;border-radius:6px;visibility:hidden;transition:top .75s var(--ease),left .75s var(--ease),width .75s var(--ease),height .75s var(--ease),border-radius .75s,background .5s .4s}
#mp.full{background:#fff;border-radius:0}
#mp .body{position:absolute;inset:0;overflow-y:auto;padding:calc(90px + env(safe-area-inset-top,0px)) 24px 80px;opacity:0;transition:opacity .4s}
#mp.show .body{opacity:1;transition-delay:.6s}
.x{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:18px;z-index:3;width:44px;height:44px;border-radius:50%;border:1px solid var(--ink);background:#fff;color:var(--ink);font:300 22px 'Inter',sans-serif;cursor:pointer;transition:.35s var(--ease)}
.x:hover{background:var(--ink);color:#fff;transform:rotate(90deg)}
.mw{max-width:900px;margin:0 auto;display:grid;grid-template-columns:300px 1fr;gap:clamp(24px,5vw,60px);align-items:start}
@media(max-width:760px){.mw{grid-template-columns:1fr}nav ul li:nth-child(n+4){display:none}}
.pf{aspect-ratio:3/4;border-radius:10px;background:linear-gradient(160deg,#f0f0f0,#d6d6d6);display:grid;place-items:center;font:800 110px 'Noto Sans KR',sans-serif;color:#fff;position:relative;overflow:hidden;clip-path:inset(100% 0 0 0);transition:clip-path 1s var(--ease) .7s}
#mp.show .pf{clip-path:inset(0)}
.pf small{position:absolute;bottom:12px;font:11px 'Noto Sans KR';color:#999;letter-spacing:.05em}
.mw h1{font-size:clamp(40px,7vw,72px);font-weight:800;letter-spacing:-.05em;line-height:1.05}
.role{font:600 12px 'Inter',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin:12px 0 28px}
.mw h3{font:600 11px 'Inter',sans-serif;color:var(--mute);margin:34px 0 10px;letter-spacing:.2em;text-transform:uppercase;border-top:1px solid var(--line);padding-top:14px}
.mw ul{margin:0;padding:0;list-style:none}.mw li{padding:4px 0;font-size:15px}
.it>*{opacity:0;transform:translateY(26px);transition:opacity .7s,transform .8s var(--ease)}
#mp.show .it>*{opacity:1;transform:none}
#mp.show .it>*:nth-child(1){transition-delay:.75s}#mp.show .it>*:nth-child(2){transition-delay:.85s}#mp.show .it>*:nth-child(3){transition-delay:.95s}#mp.show .it>*:nth-child(4){transition-delay:1.05s}#mp.show .it>*:nth-child(5){transition-delay:1.15s}#mp.show .it>*:nth-child(6){transition-delay:1.25s}#mp.show .it>*:nth-child(7){transition-delay:1.35s}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
.b.m img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.1);opacity:.5;transition:opacity .4s,transform .6s var(--ease)}
.b.m:hover img{opacity:.85;transform:scale(1.08)}
.b.m i,.b.m span{position:relative;z-index:1}
.w{cursor:pointer}
.w .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1);transition:filter .5s,transform .8s var(--ease)}
.w:hover .ph img{filter:none;transform:scale(1.05)}
.pf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mw a{color:inherit;text-underline-offset:3px}
.mw li span{color:var(--mute);font-size:12px;margin-left:8px}
.cta{display:inline-block;margin-top:22px;padding:12px 24px;border:1px solid currentColor;border-radius:99px;font:600 13px 'Inter',sans-serif;color:inherit;text-decoration:none;transition:opacity .3s,transform .3s}
.cta:hover{opacity:.6;transform:translateX(4px)}
.edb{border:0;background:none;font:inherit;color:var(--mute);text-decoration:underline;cursor:pointer;padding:0}
.ed{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);z-index:130;background:#fff;border-left:1px solid var(--ink);box-shadow:-20px 0 50px rgba(0,0,0,.15);display:flex;flex-direction:column;gap:10px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(105%);transition:transform .6s var(--ease)}
.ed.on{transform:none}
.ed .eh{display:flex;justify-content:space-between;align-items:center;font:600 14px 'Inter','Noto Sans KR'}
.ed textarea{flex:1;min-height:0;width:100%;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:8px;padding:12px;resize:none;color:var(--ink);background:var(--soft)}
.ed button,.ed label{font:600 12px 'Inter','Noto Sans KR',sans-serif;border:1px solid var(--ink);background:#fff;color:var(--ink);padding:9px 14px;border-radius:99px;cursor:pointer}
.ed button:hover,.ed label:hover{background:var(--ink);color:#fff}
.ed .er{display:flex;flex-wrap:wrap;gap:6px}
.ed input[type=text]{width:100%;font:11px ui-monospace,monospace;padding:8px;border:1px solid var(--line);border-radius:6px;margin-top:6px}
.ed p{margin:0;font-size:11px;color:var(--mute);line-height:1.6}
.ed input[type=file]{display:none}
</style>
</head>
<body>
<nav><a class="logo" href="#top" id="lg"></a><ul id="nl"></ul></nav>
<header class="hero" id="top">
 <div class="bn" id="bn"></div>
 <div class="intro">
  <div class="big rv" id="big"></div>
  <div class="tag" id="tg"></div>
  <div class="sub" id="sb"></div>
 </div>
</header>
<div id="secs"></div>
<section id="members" class="rv"><div class="h"><small id="mn"></small><h2 id="mt"></h2></div><div class="grid" id="grid"></div><div class="hint" id="ht"></div></section>
<section id="works"><div class="h rv"><small id="wn"></small><h2 id="wt"></h2></div><div class="works" id="wk"></div></section>
<footer><b id="fb"></b><span id="ft"></span><button class="edb" id="edb">편집</button></footer>
<div id="mp"><button class="x" aria-label="닫기">×</button><div class="body"><div class="mw" id="mc"></div></div></div>
<aside class="ed" id="ed">
 <div class="eh"><span>사이트 내용 편집 (JSON)</span><button id="edx">닫기</button></div>
 <textarea id="edt" spellcheck="false"></textarea>
 <div class="er"><button id="ea">적용</button><button id="es">이 브라우저에 저장</button><button id="ec">JSON 복사</button><button id="er">기본값으로</button><label>이미지 선택<input type="file" id="ef" accept="image/*"></label></div>
 <input type="text" id="eo" readonly placeholder="이미지 변환값 (커서 위치에 자동 삽입 + 복사)">
 <p id="em">"img", "photo" 칸의 따옴표 사이에 커서를 두고 ‘이미지 선택’을 누르면 그 자리에 이미지가 들어갑니다. 저장은 이 브라우저에만 적용되니, 영구 반영하려면 JSON을 복사해 코드의 DEF에 붙여 넣으세요.</p>
</aside>
<script>
/* ============ 사이트 내용 설정 (DEF) ============
 img / photo : 이미지 주소. 게시된 페이지는 외부 URL을 불러오지 못하므로 ‘편집’ 패널의 이미지 선택(데이터 URI)을 쓰세요.
 banners 개수 = 하단 점(o o o) 개수, members 개수 = 블록 격자 크기, works = 작품 카드 ============ */
var DEF={
 site:{name:'onb',tagline:['Only','Nothing','But everything'],sub:'온비는 하나의 창작 집단입니다.',footer:'Only, Nothing, But everything · © 2026 onb'},
 titles:{members:'멤버 소개',works:'작품 소개',hint:'검은 블록을 눌러 보세요'},
 bannerSeconds:5,
 banners:[
  {small:'onb creative collective',title:'Only, Nothing, But everything',text:'온비는 하나의 창작 집단입니다.',img:'',light:false,cta:{label:'소개 보기',href:'#about'}},
  {small:'Why onb',title:'누구도 하지 않으려는 이야기를.',text:'애써 하는 것, 그게 온비의 의의입니다.',img:'',light:true},
  {small:'Art',title:'가장 나다운 것,<br>그것이 예술.',text:'사라지는 시선들을 기록합니다.',img:'',light:false},
  {small:'Since 2025 · Est. 2026',title:'다섯 개의 서로 다른 시선.',text:'멤버와 작품을 만나 보세요.',img:'',light:true,cta:{label:'멤버 보기',href:'#members'}}],
 sections:[
  {id:'about',title:'소개',body:['2025년부터 명맥을 이어오다, <span class="hl">2026년 설립</span>되었습니다.','(이하 소개 문구는 추후 채워 넣어 주세요.)']},
  {id:'why',title:'왜 온비여야 하는가?',nav:'왜 온비?',quote:'누구도 하지 않으려는 이야기를,<br>애써 하는 것.',body:['세상엔 너무 좋은 글과 음악이 많습니다. 하지만 세상은 너무 정형화되어 있고, 잘 팔리는 글과 음악이 정해져 있는 듯합니다.','그런데 누군가 신나는 음악을 하고, 이별 이야기를 하면. 또 누군가 예쁘기만 한 시를 쓰고 모두가 잘 팔리는 소설을 쓰면, 또 누군가는 <span class="hl">불편하더라도 직시해야 하는 내용</span>을 써야 하지 않을까요?','그게 온비의 의의라고 생각합니다. 누구도 하지 않으려는 이야기를 애써 하는.']},
  {id:'art',title:'온비가 추구하는 예술',nav:'예술',body:['예술은 그런 것 같습니다. 우린 결국 다 죽습니다. 죽으면 뭐가 사라질까요? 나라는 인격이 사라집니다. 내가 죽고, 나라는 인격이 사라지는 순간 내가 바라봤던 세상과, 그 시선, 의미가, 또 기분들이 전부 사라져 버리고 말죠.','너무 아쉽지 않나요? 그렇게 사라지는 시선들이 얼마나 많은데 말입니다.','결국 예술은, 가장 나다운 것, 그 동시에 누구나 보는 시선을 조금 다른 시선에서 보고 직시하는 것이 아닐까 생각합니다.'],closing:'가장 나다운 걸 하고,<br>나 같은 것, <span class="hl">그것이 예술</span>입니다.'}],
 members:[
  {
    id:'kbg',
    name:'김별규',
    initial:'별', role:'Music', photo:'',
    bio:'2010년 5월 10일생. 현직 싱어송라이터이자 작가. 2024년 11월 27일 만 14세 나이로 싱글 [cosmpolitan]을 내며 데뷔하였다. 이후 밴드 21세기 생츄어리, 브로큰 애로우로 밴드로 데뷔했으며, 2026년 7월 13일 웹 매거진 블라블라에 소설 [여섯 시 플루메리아]를 투고 및 게재하여 작가로 데뷔하였다. 2026년 6월 인디 뮤지션들이 자체적으로 개최한 패치룸 페스티벌의 청소년 루키에 약 10:1 경쟁률로 1차 합격하였다.',
    career:['2024년 11월 27일 싱글 [cosmopolitan]으로 데뷔',
    '2025년 EP [PM 9:17] 피지컬 앨범 펀딩 성공',
    '2025년 KT&G 상상마당 뮤지션 네트워킹 파티 참석',
    '2026년 6월 패치룸 페스티벌 청소년 루키 1차 합격',

  career:['2023년 12월 네이버 웹소설 [우.마.감.암] 연재','2024년 3월 네이버 웹소설 [우.마.감.암.] 베스트 도전 승격','2026년 10월 ~ 포스타입 [리벤지 바이블] 연재']},
  {id:'kdw',name:'김도완',initial:'도',role:'Writer',photo:'',bio:'삶은 어디에나 있다.',career:['2026 온비 창립']},
  {id:'lms',name:'이모씨',initial:'모',role:'Writer',photo:'',bio:'2010년 6월 20일생. 작가. 2023년 7월 [3제국] 시리즈로 데뷔, 2024년 1월 [3제국] 시리즈를 정식 연재했다.',career:['2023년 7월 [3제국] 시리즈로 데뷔','2024년 1월 [3제국] 시리즈 정식 연재']},
  {id:'jhr',name:'정하람',initial:'하',role:'Haram',photo:'',bio:'정하람은 정하람이다.',career:['2012 탄생','2026 온비 설립 멤버']}],
 works:[
  {id:'w1',title:'PM 9:17',author:'kbg',type:'음반',year:'2025',img:'',desc:['밤의 음악입니다. 제 초기작이라서 그닥 좋아하지는 않지만.'],link:{label:'안타깝지만 현재는 들으실 수 없습니다.',href:''}},
  {id:'w2',title:'REVENGE BIBLE',author:'ghj',type:'에세이',year:'2026',img:'',desc:['당신에게도 그토록 처절히 복수하고픈 사람이 있습니까. 나는 매일 칼을 갈며 살았습니다. 그 이가 죽기를 간절히 바랐습니다. 나는 맹세컨대 대가 없는 행복을 바란 적 없습니다. 내게 주어진 것이 과분할 만큼 가득하기를 바란 적이 없습니다. 하지만 나는, 나를 이토록 이가 갈려나갈 만큼 괴롭게 만든, 나를 숨도 쉬지 못하게 만든 그 이를 용서할 수 없습니다. 나의 삶은, 그래서 그렇습니다.']},
 {id:'w3',title:'여섯 시 플루메리아',author:'kbg',type:'소설',year:'2026',img:'',desc:['2026년 7월 13일 블라블라 매거진에 투고 및 게재된 단편 소설.']},]
};
var KEY='onb-config-v1',$=function(s){return document.querySelector(s)},clone=function(o){return JSON.parse(JSON.stringify(o))};
var C=null;try{C=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
C=C||clone(DEF);
function E(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function im(src,alt){return src?'<img src="'+E(src)+'" alt="'+E(alt)+'" onerror="this.remove()">':''}
function pad(n){return('0'+n).slice(-2)}
function mem(id){return(C.members||[]).find(function(m){return m.id==id})}
function arr(x){return Array.isArray(x)?x:(x?[x]:[])}
var tm,g=$('#grid'),io=new IntersectionObserver(function(e){e.forEach(function(t){if(t.isIntersecting){t.target.classList.add('on');if(t.target.id=='members')g.classList.add('go')}})},{threshold:.15});

function banner(){
 clearTimeout(tm);var B=C.banners||[],bn=$('#bn'),cur=0;
 bn.style.setProperty('--dur',(C.bannerSeconds||5)*1000+'ms');
 bn.innerHTML='<div class="dots" id="dots"></div><div class="cnt" id="cnt"></div>';
 var dots=$('#dots');
 B.forEach(function(s,i){
  var d=document.createElement('div');d.className='sl'+(s.light?' light':'');
  if(s.img)d.style.backgroundImage='linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.65)),url("'+String(s.img).replace(/"/g,'%22')+'")';
  d.innerHTML='<small>'+(s.small||'')+'</small><h2>'+(s.title||'')+'</h2><p>'+(s.text||'')+'</p>'+(s.cta?'<div><a class="cta" href="'+E(s.cta.href)+'">'+E(s.cta.label)+' →</a></div>':'');
  bn.insertBefore(d,dots);
  var b=document.createElement('button');b.className='dot';b.setAttribute('aria-label',(i+1)+'번 배너');b.innerHTML='<i></i>';b.onclick=function(){go(i)};dots.appendChild(b)});
 var sls=bn.querySelectorAll('.sl'),dts=dots.children;
 function go(i){
  if(!B.length)return;cur=(i+B.length)%B.length;
  for(var k=0;k<B.length;k++){sls[k].classList.toggle('on',k==cur);dts[k].classList.remove('on')}
  void dots.offsetWidth;dts[cur].classList.add('on'); /* 진행바 재시작 = 타이머 초기화 */
  bn.classList.toggle('lt',!!(B[cur].light&&!B[cur].img));
  $('#cnt').textContent=pad(cur+1)+' / '+pad(B.length);
  clearTimeout(tm);if(B.length>1)tm=setTimeout(function(){go(cur+1)},(C.bannerSeconds||5)*1000);
 }
 go(0);
}

function render(){
 var s=C.site||{},T=C.titles||{},S=C.sections||[],Ms=C.members||[],Ws=C.works||[];
 document.title=s.name+' — '+arr(s.tagline).join(', ');
 $('#lg').textContent=s.name;$('#fb').textContent=s.name;$('#ft').textContent=s.footer||'';
 $('#big').innerHTML=String(s.name).split('').map(function(c,i){return'<span style="transition-delay:'+i*.12+'s">'+E(c)+'</span>'}).join('');
 $('#tg').innerHTML=arr(s.tagline).map(function(t){return'<em>'+E(t)+'</em>'}).join(', ');$('#sb').textContent=s.sub||'';
 var links=S.map(function(x){return[x.id,x.nav||x.title]}).concat([['members',T.members],['works',T.works]]);
 $('#nl').innerHTML=links.map(function(l){return'<li><a class="l" href="#'+E(l[0])+'">'+l[1]+'</a></li>'}).join('');
 banner();
 $('#secs').innerHTML=S.map(function(x,i){return'<section id="'+E(x.id)+'" class="rv"><div class="h"><small>'+pad(i+1)+'</small><h2>'+x.title+'</h2></div>'+(x.quote?'<p class="q">'+x.quote+'</p>':'')+'<div class="txt">'+arr(x.body).map(function(p){return'<p>'+p+'</p>'}).join('')+'</div>'+(x.closing?'<p class="q" style="margin-top:50px">'+x.closing+'</p>':'')+'</section>'}).join('');
 $('#mn').textContent=pad(S.length+1);$('#mt').textContent=T.members;$('#wn').textContent=pad(S.length+2);$('#wt').textContent=T.works;$('#ht').textContent=T.hint||'';
 /* 멤버 격자 N×N */
 var n=Ms.length,N=Math.max(3,n<=8?n:Math.ceil(Math.sqrt(n*2.5))),pos={},h='';
 Ms.forEach(function(m,k){pos[n<=N?k*(N+1):Math.floor((k+.5)*N*N/n)]=k});
 g.classList.remove('go');g.style.gridTemplateColumns='repeat('+N+',1fr)';g.style.maxWidth=Math.min(640,N*128)+'px';
 for(var y=0;y<N;y++)for(var x=0;x<N;x++){var p=y*N+x,d=x+y,k=pos[p];
  h+=k!=null?'<button class="b m" data-k="'+E(Ms[k].id)+'" style="--d:'+d+'">'+im(Ms[k].photo,Ms[k].name)+'<i>'+E(Ms[k].initial||Ms[k].name[0])+'</i><span>'+E(Ms[k].name)+'</span></button>':'<div class="b d'+(d%3==0?' k':'')+'" style="--d:'+d+'"></div>'}
 g.innerHTML=h;
 $('#wk').innerHTML=Ws.map(function(w,i){var a=mem(w.author);return'<div class="w rv" data-k="w-'+E(w.id)+'" style="--n:'+i%4+'"><div class="ph">'+(w.img?im(w.img,w.title):pad(i+1))+'</div><h3>'+E(w.title)+'</h3><p>'+E((a?a.name:w.author||'')+(w.type?' · '+w.type:''))+'</p></div>'}).join('');
 document.querySelectorAll('.rv:not(.on)').forEach(function(e){io.observe(e)});
 if($('#members').classList.contains('on'))setTimeout(function(){g.classList.add('go')},80);
}

function memberHtml(m){
 var ws=(C.works||[]).filter(function(w){return w.author==m.id});
 return'<div class="pf"><span>'+E(m.initial||m.name[0])+'</span>'+im(m.photo,m.name)+'</div><div class="it"><h1>'+E(m.name)+'</h1><div class="role">'+E(m.role||'')+'</div>'+arr(m.bio).map(function(p){return'<p>'+p+'</p>'}).join('')+'<h3>Career</h3><ul>'+arr(m.career).map(function(c){return'<li>'+c+'</li>'}).join('')+'</ul><h3>Works</h3><ul>'+(ws.length?ws.map(function(w){return'<li><a href="#w-'+E(w.id)+'">'+E(w.title)+'</a><span>'+E([w.type,w.year].filter(Boolean).join(' · '))+'</span></li>'}).join(''):'<li>등록된 작품이 없습니다</li>')+'</ul></div>';
}
function workHtml(w){
 var a=mem(w.author);
 return'<div class="pf"><span>'+E((w.title||'')[0]||'')+'</span>'+im(w.img,w.title)+'</div><div class="it"><h1>'+E(w.title)+'</h1><div class="role">'+E([w.type,w.year].filter(Boolean).join(' · '))+'</div>'+(a?'<p>by <a href="#'+E(a.id)+'">'+E(a.name)+'</a></p>':(w.author?'<p>by '+E(w.author)+'</p>':''))+arr(w.desc).map(function(p){return'<p>'+p+'</p>'}).join('')+(w.link&&w.link.href?'<a class="cta" href="'+E(w.link.href)+'" target="_blank" rel="noopener">'+E(w.link.label||'보러 가기')+' →</a>':'')+'</div>';
}

var mp=$('#mp'),cur=null;
function src(k){return document.querySelector('[data-k="'+String(k).replace(/"/g,'')+'"]')}
function rect(k){var e=src(k);return e?e.getBoundingClientRect():{top:innerHeight/2,left:innerWidth/2,width:0,height:0}}
function setR(r){mp.style.top=r.top+'px';mp.style.left=r.left+'px';mp.style.width=r.width+'px';mp.style.height=r.height+'px'}
function open(k,html){
 var swap=!!cur;cur=k;$('#mc').innerHTML=html;
 if(swap){mp.classList.remove('show');void mp.offsetWidth;mp.classList.add('show');mp.querySelector('.body').scrollTop=0;return}
 mp.style.transition='none';mp.classList.remove('full','show');setR(rect(k));mp.style.visibility='visible';
 document.body.style.overflow='hidden';void mp.offsetWidth;mp.style.transition='';
 requestAnimationFrame(function(){mp.classList.add('full','show');mp.style.top=mp.style.left='0';mp.style.width='100vw';mp.style.height='100%';mp.querySelector('.body').scrollTop=0});
}
function close(){
 if(!cur)return;var k=cur;cur=null;
 mp.classList.remove('show','full');setR(rect(k));document.body.style.overflow='';
 setTimeout(function(){if(!cur)mp.style.visibility='hidden'},780);
}
function route(){
 var h=decodeURIComponent(location.hash.slice(1)),m=mem(h),w=h.indexOf('w-')==0&&(C.works||[]).find(function(x){return x.id==h.slice(2)});
 if(m){if(cur!=h)open(h,memberHtml(m))}else if(w){if(cur!=h)open(h,workHtml(w))}else close();
}
document.addEventListener('click',function(e){var b=e.target.closest('#grid [data-k],#wk [data-k]');if(b)location.hash=b.dataset.k});
$('.x').onclick=function(){history.length>1&&cur?history.back():(location.hash='top')};
addEventListener('hashchange',route);
addEventListener('keydown',function(e){if(e.key=='Escape')$('#ed').classList.contains('on')?$('#ed').classList.remove('on'):$('.x').click()});

/* ===== 편집 패널 ===== */
var ed=$('#ed'),et=$('#edt'),em0=$('#em').textContent;
function msg(t){$('#em').textContent=t}
$('#edb').onclick=function(){et.value=JSON.stringify(C,null,1);ed.classList.add('on')};
$('#edx').onclick=function(){ed.classList.remove('on')};
$('#ea').onclick=function(){try{C=JSON.parse(et.value);close();render();msg('적용했습니다.')}catch(e){msg('JSON 오류: '+e.message)}};
$('#es').onclick=function(){try{localStorage.setItem(KEY,et.value);msg('이 브라우저에 저장했습니다.')}catch(e){msg('저장할 수 없습니다.')}};
$('#ec').onclick=function(){et.select();try{navigator.clipboard.writeText(et.value);msg('복사했습니다.')}catch(e){document.execCommand&&document.execCommand('copy')}};
$('#er').onclick=function(){try{localStorage.removeItem(KEY)}catch(e){}C=clone(DEF);et.value=JSON.stringify(C,null,1);close();render();msg('기본값으로 되돌렸습니다.')};
$('#ef').onchange=function(){
 var f=this.files[0];if(!f)return;var r=new FileReader();
 r.onload=function(){var i=new Image();i.onload=function(){
  var sc=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*sc;c.height=i.height*sc;
  c.getContext('2d').drawImage(i,0,0,c.width,c.height);var u=c.toDataURL('image/jpeg',.82);
  $('#eo').value=u;var p=et.selectionStart;et.value=et.value.slice(0,p)+u+et.value.slice(p);
  try{navigator.clipboard.writeText(u)}catch(e){}msg('이미지를 커서 위치에 넣었습니다. ‘적용’을 눌러 확인하세요.')};i.src=r.result};
 r.readAsDataURL(f);this.value='';
};

render();
if(location.hash.length>1){g.classList.add('go');setTimeout(function(){var e=src(decodeURIComponent(location.hash.slice(1)));if(e)e.scrollIntoView({block:'center'});setTimeout(route,300)},200)}
</script>
